# deploy/operator/operator.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: clustervis-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clustervis-operator
  namespace: clustervis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustervis-operator
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clustervis.io"]
    resources:
      - clustertopologysnapshots
      - clustertopologysnapshots/status
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustervis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clustervis-operator
subjects:
  - kind: ServiceAccount
    name: clustervis-operator
    namespace: clustervis-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustervis-operator
  namespace: clustervis-system
  labels:
    app: clustervis-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clustervis-operator
  template:
    metadata:
      labels:
        app: clustervis-operator
    spec:
      serviceAccountName: clustervis-operator
      containers:
        - name: operator
          image: clustervis/operator:v0.1.0
          command: ["python3", "-m", "src.operator.server"]
          args: ["--port", "8080"]
          ports:
            - name: http-stream
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clustervis-operator
  namespace: clustervis-system
  labels:
    app: clustervis-operator
spec:
  selector:
    app: clustervis-operator
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
