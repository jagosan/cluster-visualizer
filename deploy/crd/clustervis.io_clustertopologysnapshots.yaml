# deploy/crd/clustervis.io_clustertopologysnapshots.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustertopologysnapshots.clustervis.io
spec:
  group: clustervis.io
  names:
    kind: ClusterTopologySnapshot
    listKind: ClusterTopologySnapshotList
    plural: clustertopologysnapshots
    singular: clustertopologysnapshot
    shortNames:
      - cts
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                exportIntervalSeconds:
                  type: integer
                  default: 10
                  minimum: 1
                excludedNamespaces:
                  type: array
                  items:
                    type: string
                scrubSecrets:
                  type: boolean
                  default: true
                trackImageDigests:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                lastSnapshotTimestamp:
                  type: string
                  format: date-time
                nodeCount:
                  type: integer
                podCount:
                  type: integer
                driftDetected:
                  type: boolean
                activeHash:
                  type: string
      subresources:
        status: {}
