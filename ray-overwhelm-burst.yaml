apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-traffic-surge
  namespace: default
  labels:
    app.kubernetes.io/name: ray-traffic-surge
    clustervis.io/overwhelm-surge: "true"
    clustervis.io/version: v1.4.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ray-traffic-surge
  template:
    metadata:
      labels:
        app: ray-traffic-surge
        app.kubernetes.io/name: ray-traffic-surge
        clustervis.io/overwhelm-surge: "true"
        clustervis.io/version: v1.4.0
    spec:
      containers:
        - name: burst-loadgen
          image: python:3.11-slim
          command: ["python3", "-c", "import time; time.sleep(86400)"]
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ray-kueue-ft02-job
  namespace: default
  labels:
    app.kubernetes.io/name: ray-kueue-ft02
    kueue.x-k8s.io/queue-name: llm-inference-queue
    kueue.x-k8s.io/priority-class: spot-burst-finetune
spec:
  parallelism: 2
  completions: 2
  suspend: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ray-kueue-ft02-job
        clustervis.io/compute-class: autopilot-spot
    spec:
      nodeSelector:
        cloud.google.com/compute-class: autopilot-spot
      restartPolicy: Never
      containers:
        - name: ek-burst-trainer
          image: python:3.11-slim
          command: ["python3", "-c", "import time; time.sleep(3600)"]
          resources:
            requests:
              cpu: 600m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 600m
              memory: 1Gi
              ephemeral-storage: 1Gi
---
