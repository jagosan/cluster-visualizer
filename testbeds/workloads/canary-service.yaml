apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-stable
  namespace: finance
  labels:
    app: payment-service
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
      track: stable
  template:
    metadata:
      labels:
        app: payment-service
        track: stable
    spec:
      containers:
        - name: payment-api
          image: payment-service:v1.2.0
          env:
            - name: TRACK
              value: stable
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service-canary
  namespace: finance
  labels:
    app: payment-service
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
      track: canary
  template:
    metadata:
      labels:
        app: payment-service
        track: canary
    spec:
      containers:
        - name: payment-api
          image: payment-service:v1.3.0-rc1
          env:
            - name: TRACK
              value: canary
