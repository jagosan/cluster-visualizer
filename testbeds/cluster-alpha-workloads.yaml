apiVersion: v1
kind: Namespace
metadata:
  name: workloads
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: workloads
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: primary
    app.kubernetes.io/version: "18.6"
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: primary
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        env:
        - name: POSTGRES_PASSWORD
          value: "cluster-vis-demo"
        ports:
        - containerPort: 5432
          name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: workloads
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: replica
    app.kubernetes.io/version: "18.6"
spec:
  serviceName: postgres-replica
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: replica
    spec:
      containers:
      - name: postgres
        image: postgres:18.6
        ports:
        - containerPort: 5432
          name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cluster
  namespace: workloads
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: "8.10.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.2
        ports:
        - containerPort: 6379
