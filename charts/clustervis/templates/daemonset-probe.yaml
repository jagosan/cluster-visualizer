{{- if .Values.probe.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "clustervis.fullname" . }}-probe
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clustervis.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe
spec:
  selector:
    matchLabels:
      {{- include "clustervis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "clustervis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: probe
    spec:
      # The probe never talks to the Kubernetes API: no token is mounted.
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: probe
          image: "{{ .Values.probe.repository }}:{{ .Values.probe.tag }}"
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.probe.pullPolicy }}
          ports:
            - name: http-metrics
              containerPort: 9102
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PROBE_INTERVAL_SECONDS
              value: {{ .Values.probe.probeIntervalSeconds | quote }}
            - name: PROBE_TIMEOUT_MS
              value: {{ .Values.probe.probeTimeoutMs | quote }}
            - name: SAMPLE_TARGET_LIMIT
              value: {{ .Values.probe.sampleTargetLimit | quote }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.probe.resources | nindent 12 }}
{{- end }}
