apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clustervis.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clustervis.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "clustervis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "clustervis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "clustervis.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLUSTERVIS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTERVIS_EXPORT_INTERVAL_SECONDS
              value: {{ .Values.operator.config.exportIntervalSeconds | quote }}
            - name: CLUSTERVIS_DEFAULT_LAYOUT_MODE
              value: {{ .Values.operator.config.defaultLayoutMode | quote }}
            - name: CLUSTERVIS_SCRUB_SECRETS
              value: {{ .Values.operator.config.scrubSecrets | quote }}
            - name: CLUSTERVIS_SCRUB_CONFIGMAPS
              value: {{ .Values.operator.config.scrubConfigMaps | quote }}
            - name: CLUSTERVIS_EXCLUDED_NAMESPACES
              value: {{ join "," .Values.operator.config.excludedNamespaces | quote }}
            - name: CLUSTERVIS_TELEMETRY_MODE
              value: {{ .Values.telemetry.mode | quote }}
            - name: CLUSTERVIS_PROMETHEUS_URL
              value: {{ .Values.telemetry.prometheus.url | quote }}
            - name: CLUSTERVIS_PROMETHEUS_LATENCY_QUERY
              value: {{ .Values.telemetry.prometheus.latencyQuery | quote }}
            - name: CLUSTERVIS_HUBBLE_RELAY_ADDRESS
              value: {{ .Values.telemetry.cilium.hubbleRelayAddress | quote }}
            - name: CLUSTERVIS_AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: CLUSTERVIS_AUTH_TYPE
              value: {{ .Values.auth.type | quote }}
            - name: CLUSTERVIS_AUTH_TOKEN_AUDIENCE
              value: {{ .Values.auth.tokenValidation.audience | quote }}
            - name: CLUSTERVIS_REQUIRE_CLUSTER_ADMIN
              value: {{ .Values.auth.tokenValidation.requireClusterAdmin | quote }}
            - name: CLUSTERVIS_PROBE_ENABLED
              value: {{ .Values.probe.enabled | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
