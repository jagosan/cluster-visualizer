# Default values for clustervis (configured for GKE in-cluster execution)
image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

operator:
  replicaCount: 1
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 48Mi
  config:
    exportIntervalSeconds: 2
    defaultLayoutMode: "skyscraper"
    scrubSecrets: true
    scrubConfigMaps: true
    excludedNamespaces:
      - kube-node-lease
      - kube-public

probe:
  enabled: true
  repository: python
  tag: "3.11-slim"
  probeIntervalSeconds: 3
  probeTimeoutMs: 500
  sampleTargetLimit: 20
  # Star-topology probing (SPEC-13 §3.5 / ADR-1305): O(N) instead of the
  # legacy all-to-all mesh. Each node probes at most K <= 5 designated targets.
  topology: "star" # "star" | "mesh"
  targets:
    ingress: ""   # host:port of the local Ingress Controller (target_type="ingress")
    api: ""       # host:port of the Kubernetes API server (target_type="api")
    azBridges: [] # list of "az:host:port" or "host:port" bridgeheads (target_type="az_bridge")
  ebpf: false     # passive eBPF RTT capture fallback
  resources:
    limits:
      cpu: 50m
      memory: 48Mi
    requests:
      cpu: 5m
      memory: 16Mi

telemetry:
  mode: "probe"
  prometheus:
    url: "http://prometheus-k8s.monitoring.svc:9090"
    latencyQuery: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[2m])) by (le, source_workload, destination_workload))'
  cilium:
    hubbleRelayAddress: "hubble-relay.kube-system.svc:4245"

auth:
  enabled: false
  type: "none"
  tokenValidation:
    audience: "clustervis"
    requireClusterAdmin: false

service:
  type: ClusterIP
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: clustervis.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
